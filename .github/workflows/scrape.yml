name: Scrape listings

on:
  schedule:
    # 3x/day — 06:00, 12:00, 18:00 UTC = 10:00, 16:00, 22:00 Baku (UTC+4)
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:  # allow manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install camoufox
          python -m camoufox fetch --browser firefox

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Run scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEADLESS: 'false'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" python notify.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add houses_listings.json seen_ids.json houses_map.html
          git diff --staged --quiet || git commit -m "chore: update listings $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
