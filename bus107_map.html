function initMap() {
  const map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 40.48, lng: 49.97 },
    zoom: 11,
    mapTypeId: 'roadmap',
  });

  const colors = ['#1a73e8', '#e8341a'];

  BUS107.routes.forEach((route, i) => {
    // Draw polyline
    new google.maps.Polyline({
      path: route.flowCoordinates,
      geodesic: true,
      strokeColor: colors[i],
      strokeOpacity: 0.85,
      strokeWeight: 4,
      map,
    });
  });

  // Deduplicate stops by stopId
  const seen = new Set();
  const stops = BUS107.stops.filter(s => {
    if (seen.has(s.stopId)) return false;
    seen.add(s.stopId);
    return true;
  });

  const infoWindow = new google.maps.InfoWindow();

  stops.forEach(s => {
    const stop = s.stop;
    if (!stop.latitude || !stop.longitude) return;

    const marker = new google.maps.Marker({
      position: { lat: parseFloat(stop.latitude), lng: parseFloat(stop.longitude) },
      map,
      title: stop.name,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 7,
        fillColor: '#34a853',
        fillOpacity: 1,
        strokeColor: '#1b6b2e',
        strokeWeight: 2,
      },
    });

    marker.addListener('click', () => {
      infoWindow.setContent(`
        <div style="font-family:sans-serif;padding:4px">
          <strong>${stop.name}</strong><br>
          <small>Stop code: ${stop.code}</small><br>
          <small>${parseFloat(stop.latitude).toFixed(6)}, ${parseFloat(stop.longitude).toFixed(6)}</small>
        </div>
      `);
      infoWindow.open(map, marker);
    });
  });
}
