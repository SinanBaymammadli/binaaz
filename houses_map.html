<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Heyet evleri — Maştağa / Albalılıq / Buzovna</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; display: flex; height: 100vh; }
  #map { flex: 1; }
  #panel {
    width: 300px; background: #fff; overflow-y: auto;
    border-left: 1px solid #e0e0e0; display: flex; flex-direction: column;
  }
  #panel-header {
    background: #6a1b9a; color: #fff; padding: 14px 16px;
    font-weight: 600; font-size: 15px; flex-shrink: 0;
  }
  #panel-header small { display: block; font-weight: 400; font-size: 11px; opacity: .8; margin-top: 2px; }
  #listing-list { flex: 1; overflow-y: auto; }
  .listing-row {
    padding: 10px 14px; border-bottom: 1px solid #f0f0f0;
    cursor: pointer; transition: background .15s;
  }
  .listing-row:hover { background: #f9f3ff; }
  .listing-row.active { background: #ede7f6; }
  .price { font-size: 14px; font-weight: 600; color: #6a1b9a; }
  .meta { font-size: 11px; color: #777; margin-top: 2px; }
  .walk { font-size: 11px; color: #388e3c; font-weight: 500; margin-top: 3px; }
  .walk.far { color: #e65100; }
  .bus { font-size: 11px; color: #1565c0; font-weight: 500; margin-top: 2px; }
  #filter-bar {
    padding: 8px 12px; border-bottom: 1px solid #eee; flex-shrink: 0;
    font-size: 12px; color: #666;
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <div id="panel-header">
    Heyet evleri
    <small id="subtitle">loading…</small>
  </div>
  <div id="filter-bar">sorted by price ↓ · click row to pan</div>
  <div id="listing-list"></div>
</div>
<script>
const LISTINGS = [{"id": "6153043", "price": 170000, "location": "Buzovna q.", "area": "4 otaqlı", "lat": 40.5127438649864, "lng": 50.12363192324168, "walk_m": 595, "walk_min": 7.9, "stop_name": "stop#856", "bus_lines": []}, {"id": "5821934", "price": 82000, "location": "Buzovna q.", "area": "5 otaqlı", "lat": 40.51572816734079, "lng": 50.1031142262996, "walk_m": 1739, "walk_min": 23.2, "stop_name": "Zuğulba yolu 96", "bus_lines": ["150"]}, {"id": "6471991", "price": 159000, "location": "Buzovna q.", "area": "4 otaqlı", "lat": 40.5156142, "lng": 50.10132739999995, "walk_m": 1931, "walk_min": 25.8, "stop_name": "Zuğulba yolu 96", "bus_lines": ["150"]}, {"id": "6465617", "price": 269000, "location": "Buzovna q.", "area": "7 otaqlı", "lat": 40.52626061423077, "lng": 50.05543301730248, "walk_m": 82, "walk_min": 1.1, "stop_name": "Albalılıq y/m (A.Rəhimov küç.)", "bus_lines": ["107", "186"]}, {"id": "6475560", "price": 260000, "location": "Buzovna q.", "area": "5 otaqlı", "lat": 40.5156142, "lng": 50.10132739999995, "walk_m": 1931, "walk_min": 25.8, "stop_name": "Zuğulba yolu 96", "bus_lines": ["150"]}, {"id": "6303589", "price": 280000, "location": "Buzovna q.", "area": "5 otaqlı", "lat": 40.5156142, "lng": 50.10132739999995, "walk_m": 1931, "walk_min": 25.8, "stop_name": "Zuğulba yolu 96", "bus_lines": ["150"]}, {"id": "6410674", "price": 300000, "location": "Maştağa q.", "area": "7 otaqlı", "lat": 40.51152963656639, "lng": 49.98114521356011, "walk_m": 276, "walk_min": 3.7, "stop_name": "Zabrat-Maştağa şos. 262", "bus_lines": ["107", "172", "186", "189", "M8"]}, {"id": "6469739", "price": 290000, "location": "Buzovna q.", "area": "4 otaqlı", "lat": 40.51722632692112, "lng": 50.08644736776482, "walk_m": 670, "walk_min": 8.9, "stop_name": "Abşeron küç. 123", "bus_lines": ["107"]}, {"id": "5413440", "price": 290000, "location": "Buzovna q.", "area": "4 otaqlı", "lat": 40.51822418816604, "lng": 50.07686565378413, "walk_m": 189, "walk_min": 2.5, "stop_name": "Abşeron küç. 190", "bus_lines": ["107"]}, {"id": "6311396", "price": 285000, "location": "Buzovna q.", "area": "5 otaqlı", "lat": 40.50319361435961, "lng": 50.10364482858878, "walk_m": 287, "walk_min": 3.8, "stop_name": "Zuğulba yolu 53", "bus_lines": ["150"]}, {"id": "6309856", "price": 285000, "location": "Buzovna q.", "area": "5 otaqlı", "lat": 40.50340470105628, "lng": 50.11055871238982, "walk_m": 491, "walk_min": 6.5, "stop_name": "Zuğulba yolu 60", "bus_lines": ["150"]}, {"id": "6408793", "price": 280000, "location": "Albalılıq q.", "area": "5 otaqlı", "lat": 40.54150489311036, "lng": 50.04260822905538, "walk_m": 2294, "walk_min": 30.6, "stop_name": "Maştağa elektrik yarımstansiyası", "bus_lines": ["186"]}, {"id": "6243897", "price": 280000, "location": "Albalılıq q.", "area": "5 otaqlı", "lat": 40.51866132988268, "lng": 50.05626002712658, "walk_m": 727, "walk_min": 9.7, "stop_name": "Abşeron küç. 359", "bus_lines": ["107"]}, {"id": "5197456", "price": 280000, "location": "Buzovna q.", "area": "4 otaqlı", "lat": 40.52063833675922, "lng": 50.03708730210892, "walk_m": 197, "walk_min": 2.6, "stop_name": "Abşeron küç. 441", "bus_lines": ["107"]}, {"id": "5142753", "price": 280000, "location": "Albalılıq q.", "area": "5 otaqlı", "lat": 40.54086775394429, "lng": 50.04187502720015, "walk_m": 2088, "walk_min": 27.8, "stop_name": "Maştağa elektrik yarımstansiyası", "bus_lines": ["186"]}, {"id": "5088948", "price": 275000, "location": "Buzovna q.", "area": "6 otaqlı", "lat": 40.5177142051748, "lng": 50.07087707519531, "walk_m": 41, "walk_min": 0.5, "stop_name": "Abşeron küç. 318", "bus_lines": ["107"]}, {"id": "6409278", "price": 272000, "location": "Buzovna q.", "area": "5 otaqlı", "lat": 40.52234518332733, "lng": 50.11621951802866, "walk_m": 658, "walk_min": 8.8, "stop_name": "İmam Hüseyn Məscidi", "bus_lines": ["107"]}, {"id": "6452804", "price": 270000, "location": "Buzovna q.", "area": "5 otaqlı", "lat": 40.52618661606157, "lng": 50.05414860644569, "walk_m": 191, "walk_min": 2.5, "stop_name": "Albalılıq y/m (A.Rəhimov küç.)", "bus_lines": ["107", "186"]}, {"id": "6439926", "price": 270000, "location": "Albalılıq q.", "area": "6 otaqlı", "lat": 40.53589976759793, "lng": 50.05203987304687, "walk_m": 1304, "walk_min": 17.4, "stop_name": "M.Namazov küç. 9", "bus_lines": ["186"]}, {"id": "6368428", "price": 270000, "location": "Albalılıq q.", "area": "5 otaqlı", "lat": 40.52998093183837, "lng": 50.06353525186934, "walk_m": 509, "walk_min": 6.8, "stop_name": "A.Rəhimov küç. (Albalılıq y/m)", "bus_lines": ["107", "186"]}, {"id": "6138827", "price": 270000, "location": "Albalılıq q.", "area": "4 otaqlı", "lat": 40.5452108783234, "lng": 50.04079605285644, "walk_m": 2391, "walk_min": 31.9, "stop_name": "Maştağa elektrik yarımstansiyası", "bus_lines": ["186"]}];

let map, infoWindow, markers = {};

function initMap() {
  map = new google.maps.Map(document.getElementById('map'), {
    center: {lat: 40.54, lng: 50.0},
    zoom: 12,
    mapTypeId: 'roadmap',
  });
  infoWindow = new google.maps.InfoWindow();

  const list = document.getElementById('listing-list');
  document.getElementById('subtitle').textContent =
    LISTINGS.length + ' listings with coordinates';

  // Sort by price desc
  const sorted = [...LISTINGS].sort((a, b) => (b.price || 0) - (a.price || 0));

  sorted.forEach(l => {
    const price = l.price ? l.price.toLocaleString() + ' AZN' : '?';
    const walkClass = l.walk_min > 15 ? 'far' : '';
    const busLine = l.bus_lines && l.bus_lines.length ? 'Bus ' + l.bus_lines.join(', ') : 'no named line';

    // Marker
    const marker = new google.maps.Marker({
      position: {lat: parseFloat(l.lat), lng: parseFloat(l.lng)},
      map,
      title: price,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 8,
        fillColor: '#6a1b9a',
        fillOpacity: 0.9,
        strokeColor: '#fff',
        strokeWeight: 2,
      },
      zIndex: 5,
    });

    const gmaps = `https://www.google.com/maps?q=${l.lat},${l.lng}`;
    const content = `
      <div style="font-family:sans-serif;min-width:210px;max-width:270px">
        <div style="font-size:16px;font-weight:700;color:#6a1b9a">${price}</div>
        <div style="color:#555;font-size:12px;margin-top:3px">${l.location || ''} · ${l.area || ''}</div>
        <div style="margin-top:7px;padding-top:7px;border-top:1px solid #eee">
          <div style="color:#${l.walk_min > 15 ? 'e65100' : '388e3c'};font-size:12px;font-weight:600">
            🚶 ${l.walk_min} min walk to nearest stop
          </div>
          <div style="color:#555;font-size:11px;margin-top:2px">${l.stop_name || ''}</div>
          <div style="color:#1565c0;font-size:12px;font-weight:600;margin-top:4px">🚌 ${busLine}</div>
        </div>
        <div style="display:flex;gap:10px;margin-top:9px;padding-top:7px;border-top:1px solid #eee">
          <a href="https://bina.az/items/${l.id}" target="_blank"
             style="font-size:12px;color:#1a73e8;text-decoration:none">bina.az →</a>
          <a href="${gmaps}" target="_blank"
             style="font-size:12px;color:#1a73e8;text-decoration:none">Google Maps →</a>
        </div>
      </div>`;

    marker.addListener('click', () => {
      infoWindow.setContent(content);
      infoWindow.open(map, marker);
      highlightRow(l.id);
    });
    markers[l.id] = marker;

    // Sidebar row
    const row = document.createElement('div');
    row.className = 'listing-row';
    row.id = 'row-' + l.id;
    row.innerHTML = `
      <div class="price">${price}</div>
      <div class="meta">${l.location || ''} · ${l.area || ''}</div>
      <div class="walk ${walkClass}">🚶 ${l.walk_min} min walk</div>
      <div class="bus">🚌 ${busLine}</div>`;
    row.addEventListener('click', () => {
      map.panTo({lat: parseFloat(l.lat), lng: parseFloat(l.lng)});
      map.setZoom(15);
      infoWindow.setContent(content);
      infoWindow.open(map, markers[l.id]);
      highlightRow(l.id);
    });
    list.appendChild(row);
  });
}

function highlightRow(id) {
  document.querySelectorAll('.listing-row').forEach(r => r.classList.remove('active'));
  const r = document.getElementById('row-' + id);
  if (r) { r.classList.add('active'); r.scrollIntoView({block: 'nearest'}); }
}
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBsgRa2Jy4Fep0LoGsR9XRP6evoyDSyTyE&callback=initMap" async defer></script>
</body>
</html>
