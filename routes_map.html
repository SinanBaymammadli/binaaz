const COLORS = {
  '107': '#1a73e8',
  '186': '#e8341a',
  'M8':  '#9334e8',
  '177': '#e88a1a',
  '189': '#1ae87f',
  '172': '#e81a8a',
  '150': '#00897b',
};

const state = {};  // busNumber -> { polylines, markers, visible }

function initMap() {
  const map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 40.48, lng: 49.97 },
    zoom: 11,
    mapTypeId: 'roadmap',
    mapTypeControl: true,
  });

  const infoWindow = new google.maps.InfoWindow();
  const panel = document.getElementById('panel');

  Object.entries(ALL_BUSES).forEach(([number, data]) => {
    const color = COLORS[number] || '#333';
    const polylines = [];
    const markers = [];

    // Draw route polylines (both directions, same color, second slightly transparent)
    data.routes.forEach((route, i) => {
      const pl = new google.maps.Polyline({
        path: route.flowCoordinates,
        geodesic: true,
        strokeColor: color,
        strokeOpacity: i === 0 ? 0.9 : 0.45,
        strokeWeight: i === 0 ? 4 : 3,
        map,
      });
      polylines.push(pl);
    });

    // Draw stops (deduplicated)
    const seen = new Set();
    data.stops.forEach(s => {
      if (seen.has(s.stopId)) return;
      seen.add(s.stopId);
      const stop = s.stop;
      if (!stop.latitude || !stop.longitude) return;

      const marker = new google.maps.Marker({
        position: { lat: parseFloat(stop.latitude), lng: parseFloat(stop.longitude) },
        map,
        title: stop.name,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 6,
          fillColor: color,
          fillOpacity: 1,
          strokeColor: 'white',
          strokeWeight: 2,
        },
      });

      marker.addListener('click', () => {
        infoWindow.setContent(`
          <div style="font-family:sans-serif;padding:4px;min-width:160px">
            <strong style="font-size:13px">${stop.name}</strong><br>
            <span style="color:#666;font-size:11px">Bus ${number} stop</span><br>
            <span style="color:#888;font-size:11px">${parseFloat(stop.latitude).toFixed(6)}, ${parseFloat(stop.longitude).toFixed(6)}</span>
          </div>
        `);
        infoWindow.open(map, marker);
      });

      markers.push(marker);
    });

    state[number] = { polylines, markers, visible: true };

    // Add toggle row to panel
    const row = document.createElement('div');
    row.className = 'route-row';
    const stopCount = new Set(data.stops.map(s => s.stopId)).size;
    row.innerHTML = `
      <div class="swatch" style="background:${color}"></div>
      <div class="route-label">${number}</div>
      <div class="route-meta">${stopCount} stops</div>
      <div class="toggle on" id="toggle-${number}"></div>
    `;
    row.addEventListener('click', () => toggleRoute(number));
    panel.appendChild(row);
  });
}

function toggleRoute(number) {
  const s = state[number];
  s.visible = !s.visible;
  const mapRef = s.polylines[0]?.getMap();
  const targetMap = s.visible ? mapRef || window._map : null;

  // We need the map reference; store it globally
  s.polylines.forEach(pl => pl.setMap(s.visible ? window._gmap : null));
  s.markers.forEach(m => m.setMap(s.visible ? window._gmap : null));

  document.getElementById(`toggle-${number}`).className = `toggle ${s.visible ? 'on' : ''}`;
}

  const map = window._gmap;
  const infoWindow = new google.maps.InfoWindow();
  const panel = document.getElementById('panel');

  Object.entries(ALL_BUSES).forEach(([number, data]) => {
    const color = COLORS[number] || '#333';
    const polylines = [];
    const markers = [];

    data.routes.forEach((route, i) => {
      const pl = new google.maps.Polyline({
        path: route.flowCoordinates,
        geodesic: true,
        strokeColor: color,
        strokeOpacity: i === 0 ? 0.9 : 0.45,
        strokeWeight: i === 0 ? 5 : 3,
        map,
      });
      polylines.push(pl);
    });

    const seen = new Set();
    data.stops.forEach(s => {
      if (seen.has(s.stopId)) return;
      seen.add(s.stopId);
      const stop = s.stop;
      if (!stop.latitude || !stop.longitude) return;

      const marker = new google.maps.Marker({
        position: { lat: parseFloat(stop.latitude), lng: parseFloat(stop.longitude) },
        map,
        title: stop.name,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 6,
          fillColor: color,
          fillOpacity: 1,
          strokeColor: 'white',
          strokeWeight: 2,
        },
      });

      marker.addListener('click', () => {
        infoWindow.setContent(`
          <div style="font-family:sans-serif;padding:4px;min-width:160px">
            <strong style="font-size:13px">${stop.name}</strong><br>
            <span style="color:#1a73e8;font-size:11px;font-weight:600">Bus ${number}</span><br>
            <span style="color:#888;font-size:11px">${parseFloat(stop.latitude).toFixed(6)}, ${parseFloat(stop.longitude).toFixed(6)}</span>
          </div>
        `);
        infoWindow.open(map, marker);
      });

      markers.push(marker);
    });

    state[number] = { polylines, markers, visible: true };

    const row = document.createElement('div');
    row.className = 'route-row';
    const stopCount = new Set(data.stops.map(s => s.stopId)).size;
    row.innerHTML = `
      <div class="swatch" style="background:${color}"></div>
      <div class="route-label">${number}</div>
      <div class="route-meta">${stopCount} stops</div>
      <div class="toggle on" id="toggle-${number}"></div>
    `;
    row.addEventListener('click', () => {
      const s = state[number];
      s.visible = !s.visible;
      s.polylines.forEach(pl => pl.setMap(s.visible ? map : null));
      s.markers.forEach(m => m.setMap(s.visible ? map : null));
      document.getElementById(`toggle-${number}`).className = `toggle ${s.visible ? 'on' : ''}`;
    });
    panel.appendChild(row);
  });
}

      visible = !visible;
      markers.forEach(m => m.setMap(visible ? map : null));
      document.getElementById('toggle-listings').className = `toggle ${visible ? 'on' : ''}`;
    });
    panel.appendChild(row);
  }
  init();
})();
/* LISTINGS_END */
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBsgRa2Jy4Fep0LoGsR9XRP6evoyDSyTyE&callback=initMap" async defer></script>
